name: Build Android app
on:
  workflow_dispatch:
    inputs:
      native:
        description: "Include the phone notification bar (Kotlin plugin)"
        type: boolean
        default: true
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - run: npm install --legacy-peer-deps
      - run: npx cap add android

      - name: Generate app icon, splash and notification icon
        run: |
          npx capacitor-assets generate --android
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_forge.png android/app/src/main/res/drawable/ic_stat_forge.png

      - name: Phone notification bar plugin (Kotlin)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.native }}
        run: python3 scripts/patch_android.py

      - name: Target Android 16 (API 36) and bump version
        run: |
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - run: npx cap sync android

      - name: Build APK (testing) and AAB (Play Store)
        run: cd android && ./gradlew assembleDebug bundleRelease

      - name: Sign the AAB
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Sign the test APK with your key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: forge-apk-for-testing
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: forge-aab-for-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
